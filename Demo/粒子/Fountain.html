<html lang="en-us">
    <head>

    <body>
        <div id="canvas-cntrNew">
            <div class="btnNew">
                <button onclick="addTex()">添加纹理资源</button>
                <button onclick="addFountain_water()">水流效果</button>
                <button onclick="addFountain_smoke()">烟雾效果</button>
                <button onclick="addFountain_diffuse()">扩散效果</button>
                <button onclick="addFountain_spray()">水花效果</button>
                <button onclick="delAll()">删除所有粒子</button>
            </div>
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="custom-loading-container">
                <div class="loading-box">
                    <div class="icon-box">
                        <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />

                    <div class="common-global-progress-box">
                        <div class="custom-progress-box">
                            <div class="progress-bar">
                                <div class="progress-bar-outer">
                                    <div class="progress-bar-inner"></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-text"></div>

                    <div class="process-info-box"></div>

        </div>

        <script async type="text/javascript" src="../../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../../javascript/BlackHole3D.js"></script>
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.preload.js"></script>
        <script async type="text/javascript" src="../Engine.js"></script>
        <!-- 引擎初始化 -->
        <script type="text/javascript">
            function RESystemEngineCreatedCallBack() {
                var worldCRS = 'EPSG:3857';
                BlackHole3D.Coordinate.setEngineWorldCRS(worldCRS); //设置引擎参考坐标系
                var forceCamLoc = new BlackHole3D.REForceCamLoc();
                forceCamLoc.force = true;
                forceCamLoc.camPos = [12776960.551609863, 4683546.090482709, 230.40473858219903];
                forceCamLoc.camRotate = [0.3560458340930769, -0.3960194622519575, -0.6294208876823961, 0.5658880593295286];
                BlackHole3D.Camera.setCamForcedInitLoc(forceCamLoc);
                var dataSetList = [
                    {
                        dataSetId: '天地图',
                        resourcesAddress:
                            'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a194449a340b4b06653b180b542e7aa',
                    },
                    {
                        dataSetId: '大坝',
                        resourcesAddress:
                            'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a15f274c9f6c7566cdff46b0058ae63',
                        useTransInfo: true,
                        transInfo: [
                            [1, 1, 1],
                            [0, 0, 0.17688231607442104, 0.9842320083497329],
                            [-7.168819741146358, -1.6519206655641199, 127.9460643631269],
                        ],
                        dataSetCRS: 'ENU:38.7337,114.77835',
                    },
                    {
                        dataSetId: '区域地图',
                        resourcesAddress:
                            'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a15f27cd17b394959b55b26a049bcb3',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }

            function addTex() {
                BlackHole3D.Particle.addTexGroup('transmitParTex_fountain', [
                    'https://demo.bjblackhole.com/demopage/examplesImgs/particle/spray.png',
                    'https://demo.bjblackhole.com/demopage/examplesImgs/particle/smoke.png',
                ]);
                BlackHole3D.Particle.addTexGroup('transmitParTex_fire', ['https://demo.bjblackhole.com/demopage/examplesImgs/particle/fire.png']);
                BlackHole3D.Particle.setTransmitSysTex('transmitParTex_fountain');
            }
            function addFountain_water() {
                let particle_water = new BlackHole3D.REParticleInfo();
                particle_water.texId = 0;
                particle_water.num = 100;
                particle_water.lifeTime = 3.5;
                particle_water.gravity = 9.8;
                particle_water.speedRange = [35.0, 37.0];
                particle_water.sizeRange = [30.0, 32.0];
                particle_water.sizeChangeRange = [0.12, 0.12];
                particle_water.alphaRange = [0.5, 1.0];
                particle_water.texUVRotAngle = 3.14;

                let transmitSys_water_01 = new BlackHole3D.REPosTransmitSysInfo();
                transmitSys_water_01.transmitSysId = 'pos_transmitSys_water_01';
                transmitSys_water_01.pos = [12777100.053, 4683598.675, 171.581];
                transmitSys_water_01.planNormal = [0.5, -0.7, -1.0];
                transmitSys_water_01.planDirectionAngleRange = [0.0, 0.0];
                transmitSys_water_01.particleInfo = particle_water;

                let transmitSys_water_02 = new BlackHole3D.REPosTransmitSysInfo();
                transmitSys_water_02.transmitSysId = 'pos_transmitSys_water_02';
                transmitSys_water_02.pos = [12777057.356, 4683582.505, 172.952];
                transmitSys_water_02.planNormal = [0.5, -0.7, -1.0];
                transmitSys_water_02.planDirectionAngleRange = [0.0, 0.0];
                transmitSys_water_02.particleInfo = particle_water;

                BlackHole3D.Particle.createTransmitSysPos([transmitSys_water_01, transmitSys_water_02]);
            }

            function addFountain_smoke() {
                let particle_water_smoke = new BlackHole3D.REParticleInfo();
                particle_water_smoke.texId = 1;
                particle_water_smoke.num = 100;
                particle_water_smoke.lifeTime = 6.0;
                particle_water_smoke.gravity = 3.5;
                particle_water_smoke.speedRange = [20.0, 20.0];
                particle_water_smoke.sizeRange = [30.0, 32.0];
                particle_water_smoke.sizeChangeRange = [0.2, 1.0];
                particle_water_smoke.alphaRange = [0.2, 0.2];

                let transmitSys_water_smoke_01 = new BlackHole3D.REPosTransmitSysInfo();
                transmitSys_water_smoke_01.transmitSysId = 'pos_transmitSys_water_smoke_01';
                transmitSys_water_smoke_01.pos = [12777100.053, 4683598.675, 171.581];
                transmitSys_water_smoke_01.planNormal = [0.5, -0.7, -1.0];
                transmitSys_water_smoke_01.planDirectionAngleRange = [0.0, 0.0];
                transmitSys_water_smoke_01.particleInfo = particle_water_smoke;

                let transmitSys_water_smoke_02 = new BlackHole3D.REPosTransmitSysInfo();
                transmitSys_water_smoke_02.transmitSysId = 'pos_transmitSys_water_smoke_02';
                transmitSys_water_smoke_02.pos = [12777057.356, 4683582.505, 172.952];
                transmitSys_water_smoke_02.planNormal = [0.5, -0.7, -1.0];
                transmitSys_water_smoke_02.planDirectionAngleRange = [0.0, 0.0];
                transmitSys_water_smoke_02.particleInfo = particle_water_smoke;

                BlackHole3D.Particle.createTransmitSysPos([transmitSys_water_smoke_01, transmitSys_water_smoke_02]);
            }

            function addFountain_diffuse() {
                let particle_water_diffuse = new BlackHole3D.REParticleInfo();
                particle_water_diffuse.texId = 1;
                particle_water_diffuse.num = 100;
                particle_water_diffuse.lifeTime = 8.2;
                particle_water_diffuse.gravity = 2.5;
                particle_water_diffuse.speedRange = [12.0, 12.0];
                particle_water_diffuse.sizeRange = [50.0, 52.0];
                particle_water_diffuse.sizeChangeRange = [0.8, 1.0];
                particle_water_diffuse.alphaRange = [0.04, 0.05];

                let transmitSys_water_diffuse_01 = new BlackHole3D.REPosTransmitSysInfo();
                transmitSys_water_diffuse_01.transmitSysId = 'pos_transmitSys_water_diffuse_01';
                transmitSys_water_diffuse_01.pos = [12777149.107, 4683500.457, 170.881];
                transmitSys_water_diffuse_01.planNormal = [0.0, -1.0, 0.0];
                transmitSys_water_diffuse_01.planDirectionAngleRange = [0.0, 360.0];
                transmitSys_water_diffuse_01.planNormalIncludedAngle = 60.0;
                transmitSys_water_diffuse_01.particleInfo = particle_water_diffuse;

                let transmitSys_water_diffuse_02 = new BlackHole3D.REPosTransmitSysInfo();
                transmitSys_water_diffuse_02.transmitSysId = 'pos_transmitSys_water_diffuse_02';
                transmitSys_water_diffuse_02.pos = [12777102.5, 4683488.457, 167.881];
                transmitSys_water_diffuse_02.planNormal = [0.0, -1.0, 0.0];
                transmitSys_water_diffuse_02.planDirectionAngleRange = [0.0, 360.0];
                transmitSys_water_diffuse_02.planNormalIncludedAngle = 60.0;
                transmitSys_water_diffuse_02.particleInfo = particle_water_diffuse;

                BlackHole3D.Particle.createTransmitSysPos([transmitSys_water_diffuse_01, transmitSys_water_diffuse_02]);
            }

            function addFountain_spray() {
                let particle_water_spray = new BlackHole3D.REParticleInfo();
                particle_water_spray.texId = 1;
                particle_water_spray.num = 100;
                particle_water_spray.lifeTime = 3.5;
                particle_water_spray.gravity = 0;
                particle_water_spray.dampingFactor = 0.015;
                particle_water_spray.speedRange = [18.0, 18.0];
                particle_water_spray.sizeRange = [10.0, 12.0];
                particle_water_spray.sizeChangeRange = [0.8, 1.0];
                particle_water_spray.alphaRange = [1.0, 0.01];
                particle_water_spray.faceDirection = 1;

                let transmitSys_water_spray_01 = new BlackHole3D.REPosTransmitSysInfo();
                transmitSys_water_spray_01.transmitSysId = 'pos_transmitSys_water_spray_01';
                transmitSys_water_spray_01.pos = [12777149.107, 4683500.457, 170.881];
                transmitSys_water_spray_01.planNormal = [0.0, 1.0, 0.0];
                transmitSys_water_spray_01.planDirectionAngleRange = [0.0, 360.0];
                transmitSys_water_spray_01.planNormalIncludedAngle = 90.0;
                transmitSys_water_spray_01.particleInfo = particle_water_spray;

                let transmitSys_water_spray_02 = new BlackHole3D.REPosTransmitSysInfo();
                transmitSys_water_spray_02.transmitSysId = 'pos_transmitSys_water_spray_02';
                transmitSys_water_spray_02.pos = [12777109.5, 4683485.457, 170.881];
                transmitSys_water_spray_02.planNormal = [0.0, 1.0, 0.0];
                transmitSys_water_spray_02.planDirectionAngleRange = [0.0, 360.0];
                transmitSys_water_spray_02.planNormalIncludedAngle = 90.0;
                transmitSys_water_spray_02.particleInfo = particle_water_spray;

                BlackHole3D.Particle.createTransmitSysPos([transmitSys_water_spray_01, transmitSys_water_spray_02]);
            }
            function delAll() {
                BlackHole3D.Particle.delTransmitSys([]);
            }
        </script>
    </body>
</html>
