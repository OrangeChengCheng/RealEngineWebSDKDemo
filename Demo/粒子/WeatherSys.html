<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>Demo</title>
        <!-- <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css"> -->
        <link rel="stylesheet" href="../DevStyle.css" />
    </head>
    <body>
        <div id="canvas-cntrNew">
            <div class="btnNew">
                <button onclick="addTex()">添加纹理资源</button>
                <button onclick="addRain()">添加天气（雨）粒子</button>
                <button onclick="addSnow()">添加天气（雪）粒子</button>
                <button onclick="delAll()">删除所有粒子</button>
            </div>
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="custom-loading-container">
                <div class="loading-box">
                    <div class="icon-box">
                        <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />
                    </div>
                    <div class="common-global-progress-box">
                        <div class="custom-progress-box">
                            <div class="progress-bar">
                                <div class="progress-bar-outer">
                                    <div class="progress-bar-inner"></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-text"></div>
                    </div>
                    <div class="process-info-box"></div>
                </div>
            </div>
        </div>
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/BlackHole3D.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.preload.js"></script> -->
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script> -->

        <script async type="text/javascript" src="../../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../../javascript/BlackHole3D.js"></script>
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.preload.js"></script>
        <script async type="text/javascript" src="../Engine.js"></script>
        <!-- 引擎初始化 -->
        <script type="text/javascript">
            var dataSetList = [
                {
                    dataSetId: 'BIM',
                    resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res03&path=res_jifang',
                },
            ];
            function addTex() {
                BlackHole3D.Particle.addTexGroup('weatherParTex_weather', [
                    'https://demo.bjblackhole.com/demopage/examplesImgs/particle/rain.png',
                    'https://demo.bjblackhole.com/demopage/examplesImgs/particle/snow.png',
                ]);
                BlackHole3D.Particle.setWeatherSysTex('weatherParTex_weather');
            }
            function addRain() {
                let weatherSys_rain = new BlackHole3D.REWeatherSysInfo();
                weatherSys_rain.weatherSysId = 'weather_rain';
                weatherSys_rain.descendSpeedRange = [14.6, 19.0];
                weatherSys_rain.disperseSpeedRange = [0.0, 0.0];
                weatherSys_rain.sizeRange = [2.5, 3.5];
                weatherSys_rain.texId = 0;
                weatherSys_rain.level = 22;
                BlackHole3D.Particle.createWeatherSys([weatherSys_rain]);
            }
            function addSnow() {
                let weatherSys_snow = new BlackHole3D.REWeatherSysInfo();
                weatherSys_snow.weatherSysId = 'weather_snow';
                weatherSys_snow.descendSpeedRange = [10.6, 15.0];
                weatherSys_snow.disperseSpeedRange = [-1.0, 1.0];
                weatherSys_snow.sizeRange = [0.2, 0.7];
                weatherSys_snow.texId = 1;
                weatherSys_snow.level = 10;
                BlackHole3D.Particle.createWeatherSys([weatherSys_snow]);
            }
            function delAll() {
                BlackHole3D.Particle.delWeatherSys([]);
            }
        </script>
    </body>
</html>
