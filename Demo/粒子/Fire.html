<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>Demo</title>
        <!-- <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css"> -->
        <link rel="stylesheet" href="../DevStyle.css" />
    </head>
    <body>
        <div id="canvas-cntrNew">
            <div class="btnNew">
                <button onclick="addTex()">添加纹理资源</button>
                <button onclick="addFire()">添加火焰</button>
                <button onclick="delAll()">删除所有粒子</button>
            </div>
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="custom-loading-container">
                <div class="loading-box">
                    <div class="icon-box">
                        <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />
                    </div>
                    <div class="common-global-progress-box">
                        <div class="custom-progress-box">
                            <div class="progress-bar">
                                <div class="progress-bar-outer">
                                    <div class="progress-bar-inner"></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-text"></div>
                    </div>
                    <div class="process-info-box"></div>
                </div>
            </div>
        </div>
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/BlackHole3D.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.preload.js"></script> -->
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script> -->

        <script async type="text/javascript" src="../../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../../javascript/BlackHole3D.js"></script>
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.preload.js"></script>
        <script async type="text/javascript" src="../Engine.js"></script>
        <!-- 引擎初始化 -->
        <script type="text/javascript">
            var dataSetList = [
                {
                    dataSetId: '房子',
                    resourcesAddress:
                        'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a16e091acfee92721089d116117fe0c',
                },
            ];

            function addTex() {
                BlackHole3D.Particle.addTexGroup('transmitParTex_fire', ['https://demo.bjblackhole.com/demopage/examplesImgs/particle/fire.png']);
                BlackHole3D.Particle.setTransmitSysTex('transmitParTex_fire');
            }
            function addFire() {
                let particle = new BlackHole3D.REParticleInfo();
                particle.texId = 0;
                particle.num = 300;
                particle.lifeTime = 4.0;
                particle.gravity = 0.0;
                particle.speedRange = [1.6, 1.6];
                particle.sizeRange = [4.0, 6.0];
                particle.sizeChangeRange = [0.2, 1.0];
                particle.alphaRange = [0.5, 0.01];
                particle.texUVRotAngle = 0.68;

                let transmitSys_pos = new BlackHole3D.RERectTransmitSysInfo();
                transmitSys_pos.transmitSysId = 'rect_transmitSys_fire';
                transmitSys_pos.pos = [3.0, 3.0, 3.0];
                transmitSys_pos.planWidth = 1.0;
                transmitSys_pos.planHeight = 1.0;
                transmitSys_pos.planNormal = [0.0, -1.0, 0.0];
                transmitSys_pos.planRightDirection = [1.0, 0.0, 0.0];
                transmitSys_pos.planDirectionAngleRange = [0.0, 0.0];
                transmitSys_pos.particleInfo = particle;
                

                BlackHole3D.Particle.createTransmitSysRect([transmitSys_pos]);
            }

            function delAll() {
                BlackHole3D.Particle.delTransmitSys([]);
            }
        </script>
    </body>
</html>
