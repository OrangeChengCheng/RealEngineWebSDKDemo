        <!-- 引擎初始化 -->
        <script type="text/javascript">
            function RESystemEngineCreatedCallBack() {
                var dataSetList = [
                    {
                        dataSetId: 'changdi',
                        resourcesAddress:
                            'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a162cb19bba1113bef6d7cc3151e24e',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            function REDataSetLoadFinishCallBack() {}
            function addViewer() {
                // 矢量点信息
                var shpTextInfo = new BlackHole3D.REShpTextInfo();
                shpTextInfo.text = '观察点1';
                shpTextInfo.texBias = [1, 0];
                var potShpInfo = new BlackHole3D.REPotShpInfo();
                potShpInfo.shpName = 'shp_viewer_1';
                potShpInfo.pos = [310.334622994716, 406.6545212343275, 3.2293477942338527];
                potShpInfo.potSize = 4;
                potShpInfo.potClr = new BlackHole3D.REColor(255, 0, 0, 255);
                potShpInfo.textInfo = shpTextInfo;
                potShpInfo.groupName = 'group_viewer';
                BlackHole3D.Geometry.addPotShp(potShpInfo);
                // 添加通视观察点
                BlackHole3D.Analysis3D.addSightLineViewer('viewer_1', [310.334622994716, 406.6545212343275, 3.2293477942338527]);

                // 矢量点信息
                var shpTextInfo = new BlackHole3D.REShpTextInfo();
                shpTextInfo.text = '观察点2';
                shpTextInfo.texBias = [1, 0];
                var potShpInfo = new BlackHole3D.REPotShpInfo();
                potShpInfo.shpName = 'shp_viewer_2';
                potShpInfo.pos = [243.04625067787134, 469.7506502838866, 40.71955906887641];
                potShpInfo.potSize = 4;
                potShpInfo.potClr = new BlackHole3D.REColor(255, 0, 0, 255);
                potShpInfo.textInfo = shpTextInfo;
                potShpInfo.groupName = 'group_viewer';
                BlackHole3D.Geometry.addPotShp(potShpInfo);
                // 添加通视观察点
                BlackHole3D.Analysis3D.addSightLineViewer('viewer_2', [243.04625067787134, 469.7506502838866, 40.71955906887641]);
            }
            function addTarget() {

                shpTextInfo.text = '目标点1';

                var potShpInfo = new BlackHole3D.REPotShpInfo();

                potShpInfo.textInfo = shpTextInfo;
                potShpInfo.groupName = 'group_target';
                BlackHole3D.Geometry.addPotShp(potShpInfo);
                // 添加通视目标点
                BlackHole3D.Analysis3D.addSightLineTarget('viewer_1', 'target_1', [343.09427095861145, 353.338787059138, 6.56492630464961]);

                // 矢量点信息
                var shpTextInfo = new BlackHole3D.REShpTextInfo();
                shpTextInfo.text = '目标点2';
                shpTextInfo.texBias = [1, 0];
                var potShpInfo = new BlackHole3D.REPotShpInfo();
                potShpInfo.shpName = 'shp_target_2';
                potShpInfo.pos = [283.23912409673704, 312.4673186258203, 11.888850335907883];
                potShpInfo.potSize = 4;
                potShpInfo.potClr = new BlackHole3D.REColor(255, 0, 0, 255);
                potShpInfo.textInfo = shpTextInfo;
                potShpInfo.groupName = 'group_target';
                BlackHole3D.Geometry.addPotShp(potShpInfo);
                // 添加通视目标点
                BlackHole3D.Analysis3D.addSightLineTarget('viewer_1', 'target_2', [283.23912409673704, 312.4673186258203, 11.888850335907883]);

                // 矢量点信息
                var shpTextInfo = new BlackHole3D.REShpTextInfo();
                shpTextInfo.text = '目标点3';
                shpTextInfo.texBias = [1, 0];
                var potShpInfo = new BlackHole3D.REPotShpInfo();
                potShpInfo.shpName = 'shp_target_3';
                potShpInfo.pos = [212.0053382985884, 362.485893396342, 16.230244327900508];
                potShpInfo.potSize = 4;
                potShpInfo.potClr = new BlackHole3D.REColor(255, 0, 0, 255);
                potShpInfo.textInfo = shpTextInfo;
                potShpInfo.groupName = 'group_target';
                BlackHole3D.Geometry.addPotShp(potShpInfo);

                BlackHole3D.Analysis3D.addSightLineTarget('viewer_1', 'target_3', [212.0053382985884, 362.485893396342, 16.230244327900508]);

                // 矢量点信息
                var shpTextInfo = new BlackHole3D.REShpTextInfo();
                shpTextInfo.text = '目标点4';

                var potShpInfo = new BlackHole3D.REPotShpInfo();

                potShpInfo.potSize = 4;
                potShpInfo.potClr = new BlackHole3D.REColor(255, 0, 0, 255);
                potShpInfo.textInfo = shpTextInfo;

                potShpInfo.groupName = 'group_target';
                BlackHole3D.Geometry.addPotShp(potShpInfo);
                // 添加通视目标点
                BlackHole3D.Analysis3D.addSightLineTarget('viewer_2', 'target_5', [227.72854833970933, 405.86386379225684, 7.334777384248101]);
            }
            function setAttr() {
                BlackHole3D.Analysis3D.setSightLineAttrs(new BlackHole3D.REColor(0, 255, 0, 204), new BlackHole3D.REColor(255, 0, 0, 204));
            }
            function addOcc() {
                const viewIdList = BlackHole3D.Analysis3D.getSightLineAllViewerId();
                for (let i = 0; i < viewIdList.length; i++) {
                    const viewerId = viewIdList[i];
                    const targetIdList = BlackHole3D.Analysis3D.getSightLineAllTargetId(viewerId);
                    for (let k = 0; k < targetIdList.length; k++) {
                        const targetId = targetIdList[k];
                        const targetPos = BlackHole3D.Analysis3D.getSightLineTargetPos(viewerId, targetId);
                        const occPos = BlackHole3D.Analysis3D.getSightLineTargetOccPos(viewerId, targetId);
                        if (targetPos.length != 3 || occPos.length != 3) {
                            continue;
                        }
                        if (
                            !(
                                targetPos[0].toFixed(6) == occPos[0].toFixed(6) &&
                                targetPos[1].toFixed(6) == occPos[1].toFixed(6) &&
                                targetPos[2].toFixed(6) == occPos[2].toFixed(6)
                            )
                        ) {
                            // 矢量点信息
                            var shpTextInfo = new BlackHole3D.REShpTextInfo();
                            shpTextInfo.text = '遮挡点';
                            shpTextInfo.texBias = [1, 0];
                            var potShpInfo = new BlackHole3D.REPotShpInfo();
                            potShpInfo.shpName = `shp_occ_${i + 1}_${k + 1}`;
                            potShpInfo.pos = occPos;
                            potShpInfo.potSize = 4;
                            potShpInfo.potClr = new BlackHole3D.REColor(255, 0, 0, 255);
                            potShpInfo.textInfo = shpTextInfo;
                            potShpInfo.groupName = 'group_occ';
                            BlackHole3D.Geometry.addPotShp(potShpInfo);
                        }
                    }
                }
            }
        </script>
