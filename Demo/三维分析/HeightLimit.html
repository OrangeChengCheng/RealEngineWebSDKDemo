<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>Demo</title>
        <!-- <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css"> -->
        <link rel="stylesheet" href="../DevStyle.css" />
    </head>
    <body>
        <div id="canvas-cntrNew">
            <div class="btnNew">
                <button onclick="addCenter()">添加限高中心点</button>
                <select class="select" id="radius_num">
                    <option value="4">半径4</option>
                    <option value="6">半径6</option>
                    <option value="8">半径8</option>
                    <option value="10">半径10</option>
                </select>
                <select class="select" id="criticalZ_num">
                    <option value="3">限高3</option>
                    <option value="5">限高5</option>
                    <option value="7">限高7</option>
                    <option value="9">限高9</option>
                </select>
                <button onclick="addHeightLimit()">添加限高分析</button>
            </div>
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="custom-loading-container">
                <div class="loading-box">
                    <div class="icon-box">
                        <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />
                    </div>
                    <div class="common-global-progress-box">
                        <div class="custom-progress-box">
                            <div class="progress-bar">
                                <div class="progress-bar-outer">
                                    <div class="progress-bar-inner"></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-text"></div>
                    </div>
                    <div class="process-info-box"></div>
                </div>
            </div>
        </div>
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/BlackHole3D.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.preload.js"></script> -->
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script> -->

        <script async type="text/javascript" src="../../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../../javascript/BlackHole3D.js"></script>
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.preload.js"></script>
        <script async type="text/javascript" src="../Engine.js"></script>
        <!-- 引擎初始化 -->
        <script type="text/javascript">
            const selectElement_radius = document.getElementById('radius_num');
            selectElement_radius.addEventListener('change', changeHandle_radius);
            const selectElement_criticalZ = document.getElementById('criticalZ_num');
            selectElement_criticalZ.addEventListener('change', changeHandle_criticalZ);

            function RESystemEngineCreatedCallBack() {
                var dataSetList = [
                    {
                        dataSetId: 'changdi',
                        resourcesAddress:
                            'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a162cb19bba1113bef6d7cc3151e24e',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            function REDataSetLoadFinishCallBack() {}
            function addCenter() {
                // 矢量点信息
                var shpTextInfo = new BlackHole3D.REShpTextInfo();
                shpTextInfo.text = '限高中心点';
                shpTextInfo.texBias = [1, 0];
                var potShpInfo = new BlackHole3D.REPotShpInfo();
                potShpInfo.shpName = 'shp_center';
                potShpInfo.pos = [300.0, 370.0, 7.0];
                potShpInfo.potSize = 4;
                potShpInfo.potClr = new BlackHole3D.REColor(255, 0, 0, 255);
                potShpInfo.textInfo = shpTextInfo;
                potShpInfo.groupName = 'group_heightL';
                BlackHole3D.Geometry.addPotShp(potShpInfo);
            }
            function addHeightLimit() {
                let radius = Number.parseInt(document.getElementById('radius_num').value);
                let criticalZ = Number.parseInt(document.getElementById('criticalZ_num').value);
                let limitHeight = new BlackHole3D.REHeightLimitInfo();
                limitHeight.centerX = 300.0;
                limitHeight.centerY = 370.0;
                limitHeight.radius = radius;
                limitHeight.criticalZ = criticalZ;
                BlackHole3D.Analysis3D.setHeightLimitInfo(limitHeight);
                BlackHole3D.Analysis3D.setHeightLimitClr(new BlackHole3D.REColor(255, 0, 0, 128));
            }
            function changeHandle_radius(e) {
                let criticalZ = Number.parseInt(document.getElementById('criticalZ_num').value);
                let limitHeight = new BlackHole3D.REHeightLimitInfo();
                limitHeight.centerX = 300.0;
                limitHeight.centerY = 370.0;
                limitHeight.radius = Number.parseInt(this.value);
                limitHeight.criticalZ = criticalZ;
                BlackHole3D.Analysis3D.setHeightLimitInfo(limitHeight);
                BlackHole3D.Analysis3D.setHeightLimitClr(new BlackHole3D.REColor(255, 0, 0, 128));
            }
            function changeHandle_criticalZ(e) {
                let radius = Number.parseInt(document.getElementById('radius_num').value);
                let limitHeight = new BlackHole3D.REHeightLimitInfo();
                limitHeight.centerX = 300.0;
                limitHeight.centerY = 370.0;
                limitHeight.radius = radius;
                limitHeight.criticalZ = Number.parseInt(this.value);
                BlackHole3D.Analysis3D.setHeightLimitInfo(limitHeight);
                BlackHole3D.Analysis3D.setHeightLimitClr(new BlackHole3D.REColor(255, 0, 0, 128));
            }
        </script>
    </body>
</html>
