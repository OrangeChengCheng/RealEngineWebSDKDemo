<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>demo</title>
        <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css" />

        <style>
            span {
                color: black;
                font-size: 14px;
            }
            .compute-loading {
                position: absolute;
                display: none;
                top: 50%;
                left: 50%;
                width: 30%;
                height: 30px;
                transform: translate(-50%, -50%);
            }
        </style>
    </head>

    <body>
        <div id="canvas-cntrNew">
            <div class="btnNew">
                <button onclick="dradStart()">绘制填挖方计算区域，点击完成或右键结束</button>
                <button onclick="drawEnd()">绘制完成</button>
                <button onclick="compute()">开始计算</button>
                <span class="mg-l-10">填挖方高度（米）：</span><input type="text" value="3" id="EarthworkHeight" oninput="monomer()" />
            </div>
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="custom-loading-container">
                <div class="loading-box">
                    <div class="icon-box">
                        <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />
                    </div>
                    <div class="common-global-progress-box">
                        <div class="custom-progress-box">
                            <div class="progress-bar">
                                <div class="progress-bar-outer">
                                    <div class="progress-bar-inner"></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-text"></div>
                    </div>
                    <div class="process-info-box"></div>
                </div>
            </div>
            <progress class="compute-loading" id="compute_loading" value="0" max="100"></progress>
        </div>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/BlackHole3D.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.preload.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script>
        <!-- 引擎初始化 -->
        <script type="text/javascript">
            var dataSetId = 'res_qxsy';
            var dataSetList = [
                {
                    dataSetId,
                    resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res03&path=res_qxsy',
                    // resourcesAddress: 'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a141f0ff3f12cd7f2fdc262b50c9f6b',
                    useTransInfo: false,
                },
            ];
            var pointList = [];
            // 添加相关监听事件
            document.addEventListener('REEarthworkRgnFinish', REEarthworkRgnFinish); //当前填挖方区域结束回调
            document.addEventListener('REEarthworkCalcProgress', REEarthworkCalcProgress); //当前填挖方区域计算的进度

            function REEarthworkRgnFinish() {
                alert('绘制完成，可以进行计算！');
                pointList = BlackHole3D.Earthwork.getCnrsOfEarthworkRgn();
            }

            function REEarthworkCalcProgress(e) {
                const progressBar = document.getElementById('compute_loading');
                console.log(e.detail.progress * 100);
                if (progressBar) {
                    var percent = e.detail.progress * 100;
                    if (percent < 100) {
                        progressBar.style.display = 'block';
                        progressBar.value = percent;
                    } else {
                        console.log('666');
                        progressBar.style.display = 'none';

                        setTimeout(() => {
                            let data = e.detail;
                            alert(
                                `填挖方分析完成 \n 开挖面积：${data.cutarea} \n 开挖体积：${data.cutvol} \n 填充面积：${data.fillarea} \n 填充体积：${data.fillvol} \n`
                            );
                        }, 10);
                    }
                }
            }

            function dradStart() {
                BlackHole3D.Earthwork.startCreate();
            }

            function drawEnd() {
                BlackHole3D.Earthwork.endCreate();
            }

            function compute() {
                if (!pointList.length) {
                    alert('请先绘制区域！');
                    return;
                }
                var elevation = Number(document.getElementById('EarthworkHeight').value);
                BlackHole3D.Earthwork.parseData(pointList, elevation, dataSetId);
            }
        </script>
    </body>
</html>
