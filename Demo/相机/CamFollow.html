<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>Demo</title>
        <!-- <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css"> -->
        <link rel="stylesheet" href="../DevStyle.css" />
    </head>
    <body>
        <div id="canvas-cntrNew">
            <div class="btnNew">
                <button onclick="createTPP()">创建第三人称漫游</button>
                <button id="btn_camBind" onclick="camBind()">绑定相机</button>
                <button onclick="exitTPP()">退出漫游并删除人物</button>
            </div>
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="custom-loading-container">
                <div class="loading-box">
                    <div class="icon-box">
                        <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />
                    </div>
                    <div class="common-global-progress-box">
                        <div class="custom-progress-box">
                            <div class="progress-bar">
                                <div class="progress-bar-outer">
                                    <div class="progress-bar-inner"></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-text"></div>
                    </div>
                    <div class="process-info-box"></div>
                </div>
            </div>
        </div>
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/BlackHole3D.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.preload.js"></script> -->
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script> -->

        <script async type="text/javascript" src="../../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../../javascript/BlackHole3D.js"></script>
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.preload.js"></script>
        <script async type="text/javascript" src="../Engine.js"></script>
        <!-- 引擎初始化 -->
        <script type="text/javascript">
            var cambind = false;
            document.addEventListener('RECreateTPPFinish', RECreateTPPFinish);

            function RECreateTPPFinish(e) {
                console.log('-- 创建单构件对象并进入第三人称漫游完成回调事件 --', e);
                if (!e.detail.succeed) {
                    let error = '';
                    switch (e.detail.result) {
                        case 1:
                            error = '单构件模板数据集加载失败';
                            break;
                        case 2:
                            error = '单构件模板类型不存在';
                            break;
                        case 3:
                            error = '当前相机正下方空间探测失败，无法选中，请移动到下方空间能够探测的区域再进行';
                            break;
                        case 4:
                            error = '单构件对象添加失败';
                            break;
                        case 5:
                            error = '当前已存在第三人称漫游';
                            break;
                        default:
                            break;
                    }
                    cambind = false;
                    alert(`创建第三人称漫游失败, 失败原因：（${error}）`);
                } else {
                    cambind = true;
                }
                document.getElementById('btn_camBind').innerText = cambind ? '解绑相机' : '绑定相机';
            }
            function RESystemEngineCreatedCallBack() {
                var dataSetList = [
                    {
                        dataSetId: 'res_zhongyidong',
                        resourcesAddress: 'https://realbim.bjblackhole.cn:8009/default.aspx?dir=url_res02&path=res_zhongyidong',
                    },
                    {
                        dataSetId: 'renwu',
                        resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res02&path=res_xiaoren',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            function REDataSetLoadFinishCallBack() {}

            function bindEntity() {
                let _tppFollowInfo = new BlackHole3D.RETPPFollowInfo();
                _tppFollowInfo.dataSetId = 'renwu';
                _tppFollowInfo.elemId = 1;
                BlackHole3D.Camera.setCamTPPElem(_tppFollowInfo);
            }

            function createTPP() {
                let typeNames_renwu = BlackHole3D.Entity.getAllTypeNames('renwu');
                let ttpInfo = new BlackHole3D.RETPPInfo();
                ttpInfo.dataSetId = 'renwu';
                ttpInfo.entityType = typeNames_renwu[0];
                BlackHole3D.Camera.createTpp(ttpInfo);
            }

            function camBind() {
                let typeNames_renwu = BlackHole3D.Entity.getAllTypeNames('renwu');
                const entityList = BlackHole3D.Entity.getEntitys('renwu', typeNames_renwu[0]);
                if (cambind) {
                    if (!entityList.length) {
                        alert(`没有可以绑定的单构件对象，请创建第三人称漫游或创建单构件对象`);
                        return;
                    }
                    BlackHole3D.Camera.delTPP(false); // 解除绑定但不删除单构件
                } else {
                    let _tppFollowInfo = new BlackHole3D.RETPPFollowInfo();
                    _tppFollowInfo.dataSetId = entityList[0].dataSetId;
                    _tppFollowInfo.elemId = entityList[0].elemId;
                    BlackHole3D.Camera.setCamTPPElem(_tppFollowInfo);
                }
                cambind = !cambind;
                document.getElementById('btn_camBind').innerText = cambind ? '解绑相机' : '绑定相机';
            }

            function exitTPP() {
                BlackHole3D.Camera.delTPP(true); // 解除绑定并删除单构件
                document.getElementById('btn_camBind').innerText = '绑定相机';
            }
        </script>
    </body>
</html>
