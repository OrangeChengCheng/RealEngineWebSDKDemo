<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>RealEngineWebSDKDemo</title>
        <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css" />
    </head>

    <body>
        <div id="canvas-cntr">
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="btn">
                <button onclick="plan1()">切换默认</button>
                <button onclick="plan2()">切换场景1</button>
                <button onclick="plan3()">添加锚点</button>
            </div>
        </div>
        <script async type="text/javascript" src="../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../javascript/BlackHole3D.js"></script>
        <!-- 引擎初始化相关接口 -->
        <script type="text/javascript">
            // 初始化的时候必须先获取canvas实例对象，然后才可调用引擎相关接口
            BlackHole3D = typeof BlackHole3D !== 'undefined' ? BlackHole3D : {};
            BlackHole3D['canvas'] = (function () {
                var canvas = document.getElementById('canvas');
                return canvas;
            })();
            //图形窗口改变时，需实时传递给引擎，否则模型会变形
            window.onresize = function (event) {
                BlackHole3D['m_re_em_window_width'] = window.innerWidth;
                BlackHole3D['m_re_em_window_height'] = window.innerHeight;
            };
            // 刷新页面时需要卸载GPU内存
            window.onbeforeunload = function (event) {
                if (typeof BlackHole3D.releaseEngine != 'undefined') {
                    BlackHole3D.releaseEngine();
                }
            };
            // 页面加载时添加相关监听事件
            window.onload = function (event) {
                console.log('=========================== window.load()');
                if (typeof CreateBlackHoleWebSDK != 'undefined') {
                    console.log('======== RE2SDKCreateModule 存在');
                    BlackHole3D = CreateBlackHoleWebSDK(BlackHole3D);
                } else {
                    console.log('======== RE2SDKCreateModule 不存在');
                    document.addEventListener('RealEngineToBeReady', function () {
                        BlackHole3D = CreateBlackHoleWebSDK(BlackHole3D);
                    });
                }
                console.log('======== 添加监听事件');
                document.addEventListener('RESystemReady', RESystemReady);
                document.addEventListener('RESystemEngineCreated', RESystemEngineCreated);
                document.addEventListener('REDataSetLoadProgress', REDataSetLoadProgress);
                document.addEventListener('RECADLoadFinish', RECADLoadFinish);
                if (
                    typeof BlackHole3D['m_re_em_window_width'] != 'undefined' &&
                    typeof BlackHole3D['m_re_em_window_height'] != 'undefined' &&
                    typeof BlackHole3D.RealBIMWeb != 'undefined'
                ) {
                    console.log("(typeof m_re_em_window_width != 'undefined') && (typeof m_re_em_window_height != 'undefined')");
                    RESystemReady();
                }
            };
            //场景初始化，需正确传递相关参数
            function RESystemReady() {
                console.log('=========================== 引擎底层初始化完成');
                var sysInfo = new BlackHole3D.RESysInfo();
                sysInfo.workerjsPath = 'https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb_Worker.js';
                sysInfo.renderWidth = window.innerWidth;
                sysInfo.renderHieght = window.innerHeight;
                sysInfo.commonUrl = 'https://demo.bjblackhole.com/default.aspx?dir=url_res02&path=res_gol001';
                sysInfo.userName = '';
                sysInfo.passWord = '';
                BlackHole3D.initEngineSys(sysInfo);
            }
            //初始化完成后，加载项目
            function RESystemEngineCreated(e) {
                console.log('当前 WebSDK 运行版本', BlackHole3D.getVersion());
                console.log('=========================== 场景初始化完成');
                var isSuccess = e.detail.succeed;
                if (isSuccess) {
                    console.log('===========================  场景初始化 --> 成功！！！');
                    //加载CAD资源
                    BlackHole3D.CAD.loadCAD(
                        'http://realbim.bjblackhole.cn:8008/default.aspx?dir=url_res02&path=res_cad/001_007_1.realcad',
                        BlackHole3D.RECadUnitEm.CAD_UNIT_Millimeter,
                        1.0
                    );

                    BlackHole3D.Common.setMaxResMemMB(5500);
                    BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                    BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                    BlackHole3D.Common.setPageLoadLev(2);
                } else {
                    console.log('===========================  场景初始化 --> 失败！！！');
                }
            }
            // 以下为加载进度条的示例代码，仅供参考
            function REDataSetLoadProgress(e) {}
            //CAD加载完成，需要设置图形窗口显示CAD
            function RECADLoadFinish(isSuccess) {
                if (isSuccess) {
                    console.log('=========================== 引擎渲染器初始化完成 ');
                    document.getElementById('canvas').style.display = 'block';
                    BlackHole3D.canvas.focus(); //为了解决键盘事件的冲突
                    console.log('CAD加载成功!！！！！！！！！！！！！！！！！！！！！！！！');
                    //设置CAD显示
                    BlackHole3D.setViewMode(BlackHole3D.REVpTypeEm.CAD, '', BlackHole3D.REVpRankEm.LR);
                } else {
                    console.log('CAD加载失败！！！！！！！！！！！！！！！！！！！！！！！');
                }
            }

            function plan1() {
                BlackHole3D.CAD.setCurShowLayout();
            }
            function plan2() {
                BlackHole3D.CAD.setCurShowLayout('S-1-00-001');
            }
            function plan3() {
                var ancList = [];
                var anc = new BlackHole3D.RECADAnc();
                anc.anchorId = 'anchor';
                anc.layoutId = 'Model';
                anc.pos = [-750, 695];
                anc.style = 2;
                anc.innerClr = new BlackHole3D.REColor(255, 0, 0, 255);
                anc.extClr = new BlackHole3D.REColor(0, 255, 0, 255);
                ancList.push(anc);
                BlackHole3D.CAD.addAnc(ancList);
            }
        </script>
    </body>
</html>
