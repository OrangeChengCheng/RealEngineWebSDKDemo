        <!-- 引擎初始化 -->
        <script type="text/javascript">
            function RESystemEngineCreatedCallBack() {
                // 计算需要调整的数据集的仿射变换信息
                // 需要调整的数据集的点信息
                const fromPtList = [
                    [233.5011543, 150.0500784, 0.0],
                    [230.7263021, 159.3029588, 0.0],
                    [249.2512199, 164.8584082, 0.0],
                ];
                // 目标方位数据集的点信息
                const toPtList = [
                    [-0.275, 0.325, 6.5],
                    [-0.275, 9.928, 6.5],
                    [19.045, 9.928, 6.5],
                ];
                const tranInfo = BlackHole3D.Math.getPtListTran(fromPtList, toPtList);

                var dataSetList = [
                    {
                        dataSetId: 'bim',
                        resourcesAddress:
                            'http://192.168.31.16:8088/blackHole3D/EngineRes/RequestEngineRes?dir=res&path=3a2006e9091b5f644776763eb86e91ec',
                    },
                    {
                        dataSetId: 'sceneCad',
                        resourcesAddress:
                            'http://192.168.31.16:8088/blackHole3D/EngineRes/RequestEngineRes?dir=res&path=3a2008514104fe25ee8638e7f1e58229',
                        useTransInfo: true,
                        transInfo: [tranInfo.scale, tranInfo.rotate, tranInfo.offset],
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            function REDataSetLoadFinishCallBack() {}
        </script>
