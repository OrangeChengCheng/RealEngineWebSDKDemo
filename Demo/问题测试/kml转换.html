<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>Demo</title>
        <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css" />
    </head>
    <body>
        <div id="canvas-cntrNew">
            <div class="btnNew">
                <button onclick="selFile()">选取kml文件</button>
                <button onclick="kmlRender()">数据渲染</button>
                <button onclick="camLoc()">定位</button>
            </div>
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="custom-loading-container">
                <div class="loading-box">
                    <div class="icon-box">
                        <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />
                    </div>
                    <div class="common-global-progress-box">
                        <div class="custom-progress-box">
                            <div class="progress-bar">
                                <div class="progress-bar-outer">
                                    <div class="progress-bar-inner"></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-text"></div>
                    </div>
                    <div class="process-info-box"></div>
                </div>
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
        <input type="file" id="kmlFile" accept=".kml" style="display: none" />

        <script async type="text/javascript" src="../../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../../javascript/BlackHole3D.js"></script>
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.preload.js"></script>

        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/BlackHole3D.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.preload.js"></script> -->
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script>

        <!-- 引擎初始化 -->
        <script type="text/javascript">
            function RESystemEngineCreatedCallBack() {
                BlackHole3D.Common.setFakeSphMode(true);
                BlackHole3D.Coordinate.setEngineWorldCRS('EPSG:3857');

                var dataSetList = [
                    {
                        dataSetId: 'res_skymap',
                        resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res02&path=res_skymap',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            function REDataSetLoadFinishCallBack() {}

            var features = [];
            document.getElementById('kmlFile').addEventListener('change', handleFileSelect);
            function selFile() {
                const fileEl = document.getElementById('kmlFile');
                fileEl.click();
                features = [];
            }

            function handleFileSelect(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (e) {
                    // 读取KML文件内容
                    const kmlText = e.target.result;

                    // 解析KML文本为XML DOM对象
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(kmlText, 'text/xml');

                    // 转换为GeoJSON
                    const geojson = toGeoJSON.kml(xmlDoc);
                    console.log(geojson);
                    features = geojson.features;
                    alert("kml 数据读取完成");
                };
                reader.readAsText(file);
            }

            function kmlRender() {
                console.log(features);
                var pointList = [];
                features.forEach((element, index) => {
                    if (element.geometry.type == 'Point') {
                        pointList.push(element);
                    } else if (element.geometry.type == 'Polygon') {
                        const fillclr = hexToRgbaArray(element.properties['fill']);
                        const fill_opacity = element.properties['fill-opacity'];
                        addPolygon(
                            coorTo4326(element.geometry.coordinates[0]),
                            'Polygon',
                            'Polygon_' + index,
                            fillclr,
                            fill_opacity,
                            element.properties.description,
                            [255, 255, 255, 255],
                            true
                        );
                    } else if (element.geometry.type == 'LineString') {
                        const clr = hexToRgbaArray(element.properties.stroke);
                        addPolyline(
                            coorTo4326(element.geometry.coordinates),
                            'LineString',
                            'LineString_' + index,
                            clr,
                            "",
                            true
                        );
                    }
                });

                addAnc(pointList);

                setTimeout(() => {
                    alert("渲染完成");
                }, 100);
            }

            function coorTo4326(point, isforward = false) {
                return BlackHole3D.Coordinate.getTransEngineCoords(isforward, 'EPSG:4326', point);
            }

            function addPolyline(line, groupName, name, color, text, isGround = false) {
                var lineShpInfo = new BlackHole3D.RELineShpInfo();
                lineShpInfo.shpName = name;
                lineShpInfo.groupName = groupName;
                lineShpInfo.potList = line;
                lineShpInfo.lineClr = new BlackHole3D.REColor(...color);
                lineShpInfo.lineWidth = 2;
                if (isGround) lineShpInfo.projSce = true;

                var shpTextInfo = new BlackHole3D.REShpTextInfo();
                shpTextInfo.text = text;

                lineShpInfo.textInfo = shpTextInfo;
                BlackHole3D.Geometry.addPolylineShp(lineShpInfo);
            }

            function addPolygon(line, groupName, name, color, transparency, text, textColor = [255, 255, 255, 255], isGround = false) {
                var lineShpInfo = new BlackHole3D.RELineShpInfo();
                lineShpInfo.shpName = name;
                lineShpInfo.groupName = groupName;
                lineShpInfo.potList = line;
                lineShpInfo.fillState = 1;
                lineShpInfo.lineClr = new BlackHole3D.REColor(...color);
                const colorb = JSON.parse(JSON.stringify(color));
                colorb[3] = (transparency * 255) | 0;
                lineShpInfo.fillClr = new BlackHole3D.REColor(...colorb);
                lineShpInfo.lineWidth = 2;
                lineShpInfo.textPos = -3;
                if (isGround) lineShpInfo.projSce = true;

                var shpTextInfo = new BlackHole3D.REShpTextInfo();
                shpTextInfo.text = text;
                shpTextInfo.textClr = new BlackHole3D.REColor(...textColor);
                shpTextInfo.textBorderClr = new BlackHole3D.REColor(0, 0, 0, 204);

                lineShpInfo.textInfo = shpTextInfo;
                BlackHole3D.Geometry.addPolylineShp(lineShpInfo);
            }

            function addAnc(list) {
                var ancList = [];
                list.forEach((element, index) => {
                    ancList.push({
                        groupName: element.geometry.type,
                        ancName: element.geometry.type + '_' + index,
                        pos: coorTo4326([element.geometry.coordinates])[0],
                        picPath: 'https://demo.bjblackhole.com/demopage/examplesImgs/anc.png',
                        textInfo: element.properties.name,
                        picWidth: 32,
                        picHeight: 32,
                        ancSize: 60,
                        selfAutoScaleDist: -1,
                        selfVisDist: -1,
                        texBias: [1, 0],
                        texFocus: [0, 0],
                    });
                });
                BlackHole3D.Anchor.addAnc(ancList);
            }

            function hexToRgbaArray(hex, alpha = 255) {
                // 移除可能的#号
                hex = hex.replace(/^#/, '');

                // 处理3位简写形式（如#f00）
                if (hex.length === 3) {
                    hex = hex
                        .split('')
                        .map((char) => char + char)
                        .join('');
                }

                // 解析RGB分量
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);

                const a = alpha;

                // 确保值在0-255范围内
                return [Math.min(255, Math.max(0, r)), Math.min(255, Math.max(0, g)), Math.min(255, Math.max(0, b)), Math.min(255, Math.max(0, a))];
            }

            function camLoc() {
                BlackHole3D.Camera.setCamLocateTo(
                    {
                        camPos: [11703645.102342116, 3652113.3550227666, 4997.085334677069],
                        camRotate: [0.29248551363085334, 0.051864787035235435, 0.16671943845998272, 0.9401951377354989],
                        camDir: [-0.19505208236086197, 0.5326931792068745, -0.8235245363637711],
                    },
                    0,
                    1
                );
            }
        </script>
    </body>
</html>
