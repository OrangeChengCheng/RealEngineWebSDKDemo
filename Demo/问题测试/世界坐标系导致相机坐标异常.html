            function setCamToProj() {
                var dataSetId = '3a18e7a5a2d6a1ee642dabf05d7e3971';
                var backDepth = 1.0;
                var locType = BlackHole3D.RECamDirEm.CAM_DIR_DEFAULT;
                BlackHole3D.Camera.setCamLocateToDataSet(dataSetId, backDepth, locType);
            }
            function setCamToElem() {
                var locIDList = [{ dataSetId: '3a18e7a5a2d6a1ee642dabf05d7e3971', elemIdList: [1805] }];
                var backDepth = 2.0;
                var locType = BlackHole3D.RECamDirEm.CAM_DIR_DEFAULT;
                BlackHole3D.Camera.setCamLocateToElem(locIDList, backDepth, locType);
            }

            function addElemAnc() {
                // 获取构件的包围盒
                var _aabb = BlackHole3D.BIM.getElemTotalBV('3a18e7a5a2d6a1ee642dabf05d7e3971', [1805]);
                // 计算包围盒中心点坐标
                const centerX = (_aabb[1] + _aabb[0]) / 2;
                const centerY = (_aabb[3] + _aabb[2]) / 2;
                // const centerZ = (_aabb[5] + _aabb[4]) / 2;
                const centerZ = _aabb[5];
                centerPot = [centerX, centerY, centerZ];
                console.log('ElemCenterPot: ', centerPot);
                var ancList = [
                    {
                        groupName: 'camera',
                        ancName: 'anc01',
                        pos: centerPot,
                        picPath: 'https://demo.bjblackhole.com/demopage/examplesImgs/anc.png',
                        textInfo: '构件',
                        picWidth: 32,
                        picHeight: 32,
                        linePos: [0, 0],
                        lineClr: new BlackHole3D.REColor(255, 0, 0, 255), //红色
                        ancSize: 60,
                        selfAutoScaleDist: -1,
                        selfVisDist: -1,
                        texBias: [1, 0],
                        texFocus: [0, 0],
                    },
                ];
                BlackHole3D.Anchor.addAnc(ancList);
            }

            function addCamAnc() {
                var canInfo = BlackHole3D.Camera.getCamLocate();
                console.log('camCenterPot: ', canInfo.camPos);
