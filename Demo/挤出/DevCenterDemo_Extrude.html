<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>RealEngineWebSDKDemo</title>
        <script src="https://npm.elemecdn.com/vue@3/dist/vue.global.prod.js"></script>
        <link rel="stylesheet" href="https://npm.elemecdn.com/element-plus/dist/index.css" />
        <script src="https://npm.elemecdn.com/element-plus"></script>
        <link rel="stylesheet" href="https://demo.bjblackhole.com/devcenter/css/DevCenterStyleVue.css" />
        <script async type="text/javascript" src="https://demo.bjblackhole.com/devcenter/sdk/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/devcenter/sdk/BlackHole3D.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/devcenter/js/DevCenterConfig.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/devcenter/js/mouse-tip.js"></script>
    </head>

    <body>
        <div id="app">
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div id="id_option_area">
                <el-button id="id_editRgn_btn" type="primary" @click="editRgn">{{ editRgn_btn_text }}</el-button>
                <el-button id="id_delRgn_btn" type="primary" :disabled="delRgn_btn_disabled" @click="delRgn">清除区域</el-button>
                <el-select v-model="sel_extrude_type" placeholder="选择挤出类型" style="width: 160px; margin-left: 10px" @change="select_type_change">
                    <el-option v-for="item in type_options" :key="item.value" :label="item.label" :value="item.value" />
                </el-select>
                <el-select
                    v-model="sel_extrude_scope"
                    placeholder="选择作用范围"
                    style="width: 200px; margin-left: 10px"
                    @change="select_scope_change">
                    <el-option v-for="item in scope_options" :key="item.value" :label="item.label" :value="item.value" />
                </el-select>
            </div>
        </div>

        <!-- 引擎相关逻辑 -->
        <script type="text/javascript">
            // 定义全局数据
            var editRgnError_state = false; // 编辑区域错误状态
            const Extrude_ID = 'Extrude_ID'; // 挤出标识（唯一）

            // 添加监听事件
            function addListener() {
                document.addEventListener('REAddExtrudeRgnCheck', REAddExtrudeRgnCheck); //挤出添加区域检查回调事件
                document.addEventListener('REAddExtrudeRgnFinish', REAddExtrudeRgnFinish); //挤出添加区域完成回调事件
            }
            //初始化完成后，加载项目
            function RESystemEngineCreatedCallBack() {
                var dataSetList = [
                    {
                        dataSetId: '（上）挤出编辑',
                        resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res03&path=res_qxsy',
                    },
                    {
                        dataSetId: '（下）挤出编辑',
                        resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res03&path=res_qxsy',
                        useTransInfo: true,
                        transInfo: [
                            [1, 1, 1],
                            [0, 0, 0, 1],
                            [0.0, 0.0, -300.0],
                        ],
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList); // 加载一个或多个模型资源
            }
            //挤出添加区域检查回调事件
            function REAddExtrudeRgnCheck(e) {
                editRgnError_state = !e.detail.succeed;
            }
            //挤出添加区域完成回调事件
            function REAddExtrudeRgnFinish(e) {
                REWebSDK_closeMouseTip();
            }
            // 删除挤出数据
            function WebSDK_delWater() {
                BlackHole3D.Extrude.delData([Extrude_ID]); // 通过挤出名称删除指定的挤出对象
            }
            // 进入挤出编辑模式并添加挤出区域
            function WebSDK_startEditAndAddRgn() {
                BlackHole3D.Extrude.startEditState(); // 进入挤出编辑模式
                BlackHole3D.Extrude.startAddExtrudeState(Extrude_ID); // 添加挤出区域绘制
                REWebSDK_openMouseTip('canvas', '左键绘制区域，右键结束');
            }
            // 结束添加挤出区域并结束挤出编辑模式
            function WebSDK_endEditAndAddRgn() {
                BlackHole3D.Extrude.endAddExtrudeState(); // 结束挤出区域绘制
                BlackHole3D.Extrude.endEditState(); // 结束挤出编辑模式
                REWebSDK_closeMouseTip();
            }
            // 进入挤出编辑模式并将已经绘制好的区域显示矢量模式
            function WebSDK_startEditAndChangeRgn() {
                BlackHole3D.Extrude.startEditState(); // 进入挤出编辑模式
                BlackHole3D.Extrude.setShowState([Extrude_ID], 0); // 设置挤出显示状态为矢量状态
            }
            // 获取挤出数据
            function WebSDK_getExtrudeData() {
                return BlackHole3D.Extrude.getData([Extrude_ID]); // 获取当前场景中挤出对象集合
            }
            
        </script>

        <!-- UI 相关逻辑 -->
        <script>
            const app = Vue.createApp({
                data() {
                    return {
                        step_state: 0, //0: 区域绘制无效  1：开始初始区域编辑  2：展示挤出渲染模式  3：编辑已存在的挤出区域
                        editRgn_btn_text: '绘制挤出区域',
                        editRgn_state: false,
                        delRgn_btn_disabled: true,
                        sel_extrude_type: 0,
                        type_options: [
                            {
                                value: 0,
                                label: '挖空（无封口）',
                            },
                            {
                                value: 1,
                                label: '拍平（简易投射），仅对倾斜摄影和带有高程的遥感影像有效',
                            },
                            {
                                value: 2,
                                label: '挖坑（指定纹理封口），对地形数据无效',
                            },
                        ],
                        sel_extrude_scope: 2,
                        scope_options: [
                            {
                                value: 0,
                                label: '（上）挤出编辑',
                            },
                            {
                                value: 1,
                                label: '（下）挤出编辑',
                            },
                            {
                                value: 2,
                                label: '（上）挤出编辑 & （下）挤出编辑',
                            },
                        ],
                    };
                },
                methods: {
                    // 初始化数据
                    initData() {
                        // 数据初始化
                        this.editRgn_state = false;

                        // 样式初始化
                        this.editRgn_btn_text = '绘制挤出区域';
                        this.delRgn_btn_disabled = true;
                    },

                    // 绘制挤出区域/生成挤出渲染
                    editRgn() {
                        const step = this.checkStep();
                        this.step_state = step;
                        switch (step) {
                            case 0:
                                ElementPlus.ElMessage.error('请先绘制出有效挤出区域');
                                break;
                            case 1:
                                this.startEditRgn();
                                break;
                            case 2:
                                this.endEidtRgn();
                                break;
                            case 3:
                                this.changeOldRgn();
                                break;
                            default:
                                break;
                        }
                        this.updateUIStyle();
                    },

                    // 清除区域并初始化数据
                    delRgn() {
                        WebSDK_delWater();
                        this.initData();
                    },

                    // 【流程：一】 绘制初始挤出区域
                    startEditRgn() {
                        WebSDK_startEditAndAddRgn();
                        this.editRgn_state = true;
                    },

                    // 【流程：二】 结束区域编辑并渲染挤出区域
                    endEidtRgn() {
                        WebSDK_endEditAndAddRgn();
                        this.editRgn_state = false;
                    },

                    // 【流程：三】 重新编辑已有挤出区域
                    changeOldRgn() {
                        WebSDK_startEditAndChangeRgn();
                        this.editRgn_state = true;
                    },

                    // 检测流程状态 0: 区域绘制无效  1：开始初始区域编辑  2：展示挤出渲染模式  3：编辑已存在的挤出区域
                    checkStep() {
                        const extrudeList = WebSDK_getExtrudeData();
                        if (!extrudeList.length) {
                            if (this.editRgn_state) {
                                return 0;
                            } else {
                                return 1;
                            }
                        }
                        if (this.editRgn_state) {
                            if (editRgnError_state) {
                                return 0;
                            } else {
                                const extrudeInfo = extrudeList[0];
                                if (extrudeInfo.rgnList.length > 0 && extrudeInfo.rgnList[0].length > 2) {
                                    return 2;
                                } else {
                                    return 0;
                                }
                            }
                        } else {
                            return 3;
                        }
                    },

                    // UI样式更新
                    updateUIStyle() {
                        this.editRgn_btn_text = this.editRgn_state ? '生成挤出渲染' : '绘制挤出区域';
                        this.delRgn_btn_disabled = false;
                    },

                    // 挤出类型更新
                    select_type_change(type) {
                        BlackHole3D.Extrude.setShowType(Extrude_ID, type); // 设置指定挤出显示类型
                    },
                    // 挤出作用范围更新
                    select_scope_change(scope) {
                        const dataSetList = [['（上）挤出编辑'], ['（下）挤出编辑'], ['（上）挤出编辑', '（下）挤出编辑']];
                        const extrudeList = WebSDK_getExtrudeData();
                        if (!this.editRgn_state) {
                            if (extrudeList.length) {
                                BlackHole3D.Extrude.setDataSetScope(Extrude_ID, dataSetList[scope]); //设置指定挤出对象的作用范围（可以修改已经存在的挤出对象作用范围）
                            } else {
                                BlackHole3D.Extrude.setDataSetScope('', dataSetList[scope]); //设置默认的作用范围（需要在进入编辑状态前设置）
                            }
                        } else {
                            if (!extrudeList.length) return;
                            const extrudeInfo = extrudeList[0];
                            if (extrudeInfo.rgnList.length > 0 && extrudeInfo.rgnList[0].length > 2) {
                                BlackHole3D.Extrude.setDataSetScope(Extrude_ID, dataSetList[scope]); //设置指定挤出对象的作用范围（可以修改已经存在的挤出对象作用范围）
                            }
                        }
                    },
                },
            });

            app.use(ElementPlus);
            const vm = app.mount('#app');
            window.vm = vm;
        </script>
    </body>
</html>
