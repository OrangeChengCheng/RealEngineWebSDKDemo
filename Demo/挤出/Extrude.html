            <div class="btn-3">

            function addListener() {
                document.addEventListener('REAddExtrudeRgnFinish', REAddExtrudeRgnFinish); //挤出添加区域完成回调事件
                document.addEventListener('REAddExtrudeRgnCheck', REAddExtrudeRgnCheck); //挤出添加区域检查回调事件
                document.addEventListener('REEditExtrudeFinish', REEditExtrudeFinish); //编辑挤出操作完成回调事件
                //探测
                document.addEventListener('RESystemSelElement', RESystemSelElement); //鼠标探测模型事件（左键单击和右键单击）
                document.addEventListener('RESystemSelShpElement', RESystemSelShpElement); //鼠标探测矢量元素事件
            }
            function REAddExtrudeRgnFinish(e) {
                console.log("-- 挤出添加区域完成回调事件 -- ", e);
            }

                console.log("-- 挤出添加区域检查回调事件 -- ", e);
            }
            function REEditExtrudeFinish(e) {
                console.log("-- 编辑挤出操作完成回调事件 -- ", e);
            }
            function RESystemSelShpElement(e) {
                console.log('-- 鼠标探测矢量元素事件 --', BlackHole3D.Probe.getCurCombProbeRet());
            }
            function RESystemSelElement(e) {
                console.log('-- 鼠标探测模型事件 --', BlackHole3D.Probe.getCurCombProbeRet());
            }

            function local(e) {
                let id = '挤出渲染' + e;
                BlackHole3D.Camera.setCamLocateToDataSet(id, 0.8);
            }
            var Extrude_Rgn_count = 0;
            function ShpEditStart() {
                BlackHole3D.Extrude.startEditState();
            }
            function ShpEditEnd() {
                var type = Number.parseInt(document.getElementById('extrude_type').value);
                console.log("type: ", type);
                BlackHole3D.Extrude.setShowType('Extrude_' + Extrude_Rgn_count, type);
                var img = Number.parseInt(document.getElementById('extrude_img').value);
                console.log("img: ", img);
                if (img) {
                    let texId = BlackHole3D.Extrude.addExtrudeFaceTex(
                        'https://demo.bjblackhole.com/demopage/examplesImgs/skybox/06/right.jpg',
                        [5.0, 5.0]
                    );
                    BlackHole3D.Extrude.setExtrudeTexId('Extrude_' + Extrude_Rgn_count, texId);
                }
                Extrude_Rgn_count++;
                BlackHole3D.Extrude.endEditState();
            }
            function AddExtrudeRgn() {
                BlackHole3D.Extrude.startAddExtrudeState('Extrude_' + Extrude_Rgn_count);
            }
            function SetCamToData() {
                let extrudeIdList = BlackHole3D.Extrude.getAllExtrudeId();

                let extrudeIdList = BlackHole3D.Extrude.getAllExtrudeId();
