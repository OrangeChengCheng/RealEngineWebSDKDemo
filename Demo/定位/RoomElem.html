        <div id="app">
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>

                    v-model="sel_area"
                    placeholder="选择区域"

                    style="width: 160px; margin-left: 10px; margin-right: 10px"

                </el-select>

                <el-select
                    v-model="sel_model"
                    placeholder="选择模型"
                    :disabled="sel_model_disabled"
                    style="width: 160px; margin-left: 10px; margin-right: 10px"
                    @change="sel_model_change">

                methods: {

                    RESystemEngineCreatedCallBack() {

                        const clipList = [

                                    isSingleSurfaceClip: false,
                                },
                            },
                            {
                                id: 'Shp_0_volume_layer_1',
                                data: {
                                    scale: [35.0, 5.9, 1.7],
                                    rotate: [0, 0, 0, 1],
                                    offset: [23.5, -18, 4.6],
                                    isSingleSurfaceClip: false,
                                },
                            },
                            {
                                id: 'Shp_1_volume_layer_1',
                                data: {
                                    scale: [9.0, 15.5, 1.7],
                                    rotate: [0, 0, 0, 1],
                                    offset: [-1.3, 3.75, 4.6],

                        this.sel_area_disabled = false;
                        this.clipTo(this.sel_lev, this.sel_area);
                    },
                    sel_area_change(type) {
                        this.sel_model_disabled = false;
                        this.clipTo(this.sel_lev, this.sel_area);
                    },
                    clipTo(level, area) {
                        console.log(level, area);
                        const filterList = this.clipList.filter((el) => {
                            if (!area) {
                                return el.id.includes(`Shp_666`) && el.id.includes(`layer_${level - 1}`);
                            } else {
                                return el.id.includes(`Shp_${area - 1}`) && el.id.includes(`layer_${level - 1}`);
                            }
                        });
                        const clipInfo = filterList[0].data;
                        console.log(clipInfo);
                        BlackHole3D.Clip.setData(clipInfo);

                        // 相机定位
                        const aabb = this.getBoxAABB(clipInfo.offset, clipInfo.scale);
                        console.log(aabb);
                        BlackHole3D.Camera.setCamLocateToBound([aabb.min, aabb.max], 1.0, BlackHole3D.RECamDirEm.CAM_DIR_DEFAULT);
                    },

                    alert_click() {
                        BlackHole3D.Clip.resetClip();
                        BlackHole3D.Clip.endClip();
                        BlackHole3D.Camera.setCamLocateDefault(BlackHole3D.RECamDirEm.CAM_DIR_DEFAULT, false);
                    },
                    sel_model_change(type) {
                        BlackHole3D.BIM.delAllSelElems();
                        let elemIdList = this.model_options.find((el) => el.value == type).data;
                        BlackHole3D.BIM.addToSelElems('BIM模型', elemIdList);
                    },

                    /**
                     * 根据中心点、基础边长2、缩放系数计算AABB包围盒
                     * @param {number[]} center - 中心点 [x, y, z]
                     * @param {number[]} scale - 缩放系数 [a, b, c]
                     * @returns {Object} aabb { min: [x,y,z], max: [x,y,z] }
                     */
                    getBoxAABB(center, scale) {
                        const [cx, cy, cz] = center;
                        const [a, b, c] = scale;
                        // 原始盒子边长2，半长为1，乘以缩放系数
                        const halfX = 1 * a;
                        const halfY = 1 * b;
                        const halfZ = 1 * c;

                        const min = [cx - halfX, cy - halfY, cz - halfZ];
                        const max = [cx + halfX, cy + halfY, cz + halfZ];

                        return { min, max };
                    },
                },
            });

            const vm = app.mount('#app');
