                    /**
                     * 根据中心点、基础边长2、缩放系数计算AABB包围盒
                     * @param {number[]} center - 中心点 [x, y, z]
                     * @param {number[]} scale - 缩放系数 [a, b, c]
                     * @returns {Object} aabb { min: [x,y,z], max: [x,y,z] }
                     */
                    getBoxAABB(center, scale) {
                        const [cx, cy, cz] = center;
                        const [a, b, c] = scale;
                        // 原始盒子边长2，半长为1，乘以缩放系数
                        const halfX = 1 * a;
                        const halfY = 1 * b;
                        const halfZ = 1 * c;

                        const min = [cx - halfX, cy - halfY, cz - halfZ];
                        const max = [cx + halfX, cy + halfY, cz + halfZ];

                        return { min, max };
                    },
                    /**
                     * 多点平面求中心坐标
                     * @param {number[][]} points 三维点数组 [[x,y,z],...]
                     * @returns {number[]} [cx, cy, cz] 中心点
                     */
                    getPolygonCenter(points) {
                        let sumX = 0,
                            sumY = 0,
                            sumZ = 0;
                        const count = points.length;
                        for (const [x, y, z] of points) {
                            sumX += x;
                            sumY += y;
                            sumZ += z;
                        }
                        return [sumX / count, sumY / count, sumZ / count];
                    },
                },
            });

            app.use(ElementPlus);
            const vm = app.mount('#app');
            window.vm = vm;
        </script>
