        <!-- 引擎初始化 -->
        <script type="text/javascript">
            document.addEventListener('REDataSetLoadPanFinish', REDataSetLoadPanFinish);
            document.addEventListener('REPanLoadSingleFinish', REPanLoadSingleFinish);
            function RESystemEngineCreatedCallBack() {
                //加载360全景
                var dataSetList = [
                    {
                        dataSetId: 'pan01',
                        resourcesAddress:
                            'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a167e9186c8898479f21edc32cd9dae',
                    },
                ];
                BlackHole3D.Panorama.loadPan(dataSetList);

                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            function REDataSetLoadFinishCallBack() {}
            function REDataSetLoadPanFinish(e) {
                console.log('-- 全景场景加载完成事件 --', e.detail);
                var isSuccess = e.detail.succeed;
                if (isSuccess) {
                    console.log('===========================  360全景加载成功');
                    // 获取全部帧信息
                    const res = BlackHole3D.Panorama.getElemInfo('pan01');
                    BlackHole3D.Panorama.loadPanPic(res[0].elemId, 0); // 设置360显示信息
                    //设置窗口模式
                    BlackHole3D.setViewMode(BlackHole3D.REVpTypeEm.Panorama, BlackHole3D.REVpTypeEm.None, BlackHole3D.REVpRankEm.Single);
                } else {
                    console.log('===========================  360全景加载失败');
                }
            }

            function REPanLoadSingleFinish(e) {
                console.log('-- 全景场景中某一帧全景图设置成功的事件 --', e.detail);
                var isSuccess = e.detail.succeed;
                if (isSuccess) {
                    console.log('===========================  图片设置成功');
                    // //设置窗口模式
                    // BlackHole3D.System.setViewMode(BlackHole3D.REVpTypeEm.Panorama, BlackHole3D.REVpTypeEm.None, BlackHole3D.REVpRankEm.Single);
                    //加载概略图CAD数据
                    // setOverViewSize();
                    // addCADData();
                } else {
                    console.log('===========================  图片设置失败');
                }
            }
        </script>
