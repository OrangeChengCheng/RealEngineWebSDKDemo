        <!-- 引擎初始化 -->
        <script type="text/javascript">
            document.addEventListener('RECADLoadFinish', RECADLoadFinish);
            function RECADLoadFinish(e) {
                console.log('Listen RECADLoadFinish! ', e);
                BlackHole3D.setViewMode(BlackHole3D.REVpTypeEm.CAD, '', BlackHole3D.REVpRankEm.Single);
            }

            document.addEventListener('RECADCommentDrawFinish', RECADCommentDrawFinish);
            function RECADCommentDrawFinish(e) {
                console.log('Listen RECADCommentDrawFinish! ', e);
            }

            function RESystemEngineCreatedCallBack() {
                BlackHole3D.CAD.loadCAD(
                    'http://realbim.bjblackhole.cn:8008/default.aspx?dir=url_res02&path=res_cad/001_007_1.realcad',
                    BlackHole3D.RECadUnitEm.CAD_UNIT_Millimeter,
                    1.0
                );
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            function REDataSetLoadFinishCallBack() {}
