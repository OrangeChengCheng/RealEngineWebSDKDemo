<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>RealEngineWebSDKDemo</title>
        <script src="https://unpkg.com/vue@3"></script>
        <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
        <script src="https://unpkg.com/element-plus"></script>
        <link rel="stylesheet" href="../DevCenterStyleVue.css" />
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../../javascript/BlackHole3D.js"></script>
        <script async type="text/javascript" src="../DevCenterConfig.js"></script>
    </head>

    <body>
        <div id="app">
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div id="id_option_area">
                <el-button type="primary" @click="alert_click">dfsdfsdf</el-button>
            </div>
        </div>

        <!-- 引擎相关逻辑 -->
        <script type="text/javascript">
            // 添加监听事件
            function addListener() {
                //探测
                document.addEventListener('RESystemSelElement', RESystemSelElement); //鼠标探测模型事件（左键单击和右键单击）
                document.addEventListener('RESystemSelShpElement', RESystemSelShpElement); //鼠标探测矢量元素事件
            }
            function RESystemSelShpElement(e) {
                console.log('-- 鼠标探测矢量元素事件 --', BlackHole3D.Probe.getCurCombProbeRet());
            }
            function RESystemSelElement(e) {
                console.log('-- 鼠标探测模型事件 --', BlackHole3D.Probe.getCurCombProbeRet());
            }
            //初始化完成后，加载项目
            function RESystemEngineCreatedCallBack() {
                var dataSetList = [
                    {
                        dataSetId: '水面编辑',
                        resourcesAddress:
                            'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a141f4314c4a5da81256c9219dc9643',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList);
            }
        </script>

        <!-- UI 相关逻辑 -->
        <script>
            const app = Vue.createApp({
                data() {
                    return {};
                },
                methods: {
                    alert_click() {
                        console.log('-------------');

                        ElementPlus.ElMessage.error('Oops, this is a error message.');
                    },
                },
            });

            app.use(ElementPlus);
            const vm = app.mount('#app');
            window.vm = vm;
        </script>
    </body>
</html>
