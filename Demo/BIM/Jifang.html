            function registerPathFunc() {

                //     return 'dshjfsdjlkflksd';
                // });

                // 创建可更新的回调
                const createUpdatableCallback = (initialValue) => {
                    let currentValue = initialValue;

                    // 返回一个闭包函数
                    const callback = () => {
                        return currentValue;
                    };

                    // 添加更新方法
                    callback.update = (newValue) => {
                        currentValue = newValue;
                    };

                    return callback;
                };

                updatableCallback = createUpdatableCallback('4646');

                BlackHole3D.Terrain.registerPathFunc('func_1', updatableCallback);
