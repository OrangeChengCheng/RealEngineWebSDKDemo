        <!-- 引擎初始化 -->
        <script type="text/javascript">
            function RESystemEngineCreatedCallBack() {
                var dataSetList = [
                    {
                        dataSetId: 'res_jifang',
                        resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res03&path=res_jifang',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            function REDataSetLoadFinishCallBack() {}

            var updatableCallback = null;
            function registerPathFunc() {
                // BlackHole3D.Terrain.registerPathFunc('func_1', () => {
                //     return 'dshjfsdjlkflksd';
                // });
                

                // 创建可更新的回调
                const createUpdatableCallback = (initialValue) => {
                    let currentValue = initialValue;

                    // 返回一个闭包函数
                    const callback = () => {
                        return currentValue;
                    };

                    // 添加更新方法
                    callback.update = (newValue) => {
                        currentValue = newValue;
                    };

                    return callback;
                };

                updatableCallback = createUpdatableCallback('4646');

                BlackHole3D.Terrain.registerPathFunc('func_1', updatableCallback);
            }
        </script>
