<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>Demo</title>
        <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css" />
        <!-- <link rel="stylesheet" href="../DevStyle.css" /> -->
    </head>
    <body>
        <div id="canvas-cntrNew">
            <div class="btnNew">
                <button onclick="copyCanvas()">隐藏canvas</button>
                <button onclick="copyCanvasRe()">显示canvas</button>
            </div>
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="custom-loading-container">
                <div class="loading-box">
                    <div class="icon-box">
                        <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />
                    </div>
                    <div class="common-global-progress-box">
                        <div class="custom-progress-box">
                            <div class="progress-bar">
                                <div class="progress-bar-outer">
                                    <div class="progress-bar-inner"></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-text"></div>
                    </div>
                    <div class="process-info-box"></div>
                </div>
            </div>
        </div>
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/BlackHole3D.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.preload.js"></script> -->
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script> -->
        
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../../javascript/BlackHole3D.js"></script>
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.preload.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script>
        <!-- <script async type="text/javascript" src="../Engine.js"></script> -->
        <!-- 引擎初始化 -->
        <script type="text/javascript">
            function RESystemEngineCreatedCallBack() {
                var dataSetList = [
                    {
                        dataSetId: 'res_jifang',
                        resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res03&path=res_jifang',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            var delWaterState = false;
            function REDataSetLoadFinishCallBack(e) {
                if (!delWaterState) {
                    addWater();
                } 
                // else {
                //     BlackHole3D.Water.delData([]);
                // }
            }

            function addWater() {
                console.log('addWater');
                // 创建水面顶点区域对象（1）
                let rgnList_1 = [];
                let cornerRgnInfo_1 = new BlackHole3D.RECornerRgnInfo();
                cornerRgnInfo_1.pointList = [
                    [40, 80, 0],
                    [-20, 80, 0],
                    [-30, 50, 0],
                ];
                rgnList_1.push(cornerRgnInfo_1);
                // 创建水面对象（1）
                let waterInfo_1 = new BlackHole3D.REWaterInfo();
                waterInfo_1.waterName = 'water_1';
                waterInfo_1.waterClr = new BlackHole3D.REColor(255, 0, 0, 255); //水面颜色
                waterInfo_1.blendDist = 1.0; //混合系数
                waterInfo_1.visible = true; //是否可见
                waterInfo_1.rgnList = rgnList_1;

                // 创建水面顶点区域对象（2）
                let rgnList_2 = [];
                let cornerRgnInfo_2 = new BlackHole3D.RECornerRgnInfo();
                cornerRgnInfo_2.pointList = [
                    [28, 50, 0],
                    [0, 52.810488, 0],
                    [0, 0, 0],
                    [28, 0, 0],
                ];
                rgnList_2.push(cornerRgnInfo_2);
                // 创建水面对象（2）
                let waterInfo_2 = new BlackHole3D.REWaterInfo();
                waterInfo_2.waterName = 'water_2';
                waterInfo_2.rgnList = rgnList_2;

                // 创建水面对象集合
                let waterList = [waterInfo_1, waterInfo_2];
                BlackHole3D.Water.setData(waterList);
            }

            function copyCanvas() {
                delWaterState = true;
                BlackHole3D.Water.delData([]);
                // BlackHole3D.Model.unloadAllDataSet();

                const canvasBox = document.getElementsByTagName('canvas')[0];
                if (canvasBox) {
                    const body = document.querySelector('body');
                    body.append(canvasBox);
                    canvasBox.style.display = 'none';
                }
            }
            function copyCanvasRe() {
                const canvasBox = document.getElementById('canvas-cntrNew');
                let canvasContent = document.getElementsByTagName('canvas')[0];
                if (canvasBox) {
                    canvasBox.innerHTML = '';
                    canvasContent = document.getElementsByTagName('canvas')[0];
                    canvasBox.append(canvasContent);
                    canvasContent.style.display = 'block';
                }

                // BlackHole3D.m_re_em_window_width = canvasBox.clientWidth;
                // BlackHole3D.m_re_em_window_height = canvasBox.clientHeight;

                var dataSetList = [
                    {
                        dataSetId: 'res_jifang',
                        resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res03&path=res_jifang',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
            }
        </script>
    </body>
</html>
