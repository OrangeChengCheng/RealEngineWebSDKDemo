<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
        <title>Demo</title>
        <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css" />
        <!-- <link rel="stylesheet" href="../DevStyle.css" /> -->
    </head>
    <body>
        <div id="canvas-cntrNew">
            <div class="btnNew">
                <button onclick="addAnc()">添加地形矢量锚点</button>
                <button onclick="locAnc()">定位地形矢量锚点</button>
                <button onclick="addLine()">添加地形矢量线</button>
                <button onclick="locLine()">定位地形矢量线</button>
            </div>
            <canvas id="canvas" style="width: 100%; height: 100%" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
            <div class="custom-loading-container">
                <div class="loading-box">
                    <div class="icon-box">
                        <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />
                    </div>
                    <div class="common-global-progress-box">
                        <div class="custom-progress-box">
                            <div class="progress-bar">
                                <div class="progress-bar-outer">
                                    <div class="progress-bar-inner"></div>
                                </div>
                            </div>
                        </div>
                        <div class="custom-text"></div>
                    </div>
                    <div class="process-info-box"></div>
                </div>
            </div>
        </div>

        <script async type="text/javascript" src="../../javascript/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="../../javascript/BlackHole3D.js"></script>
        <script async type="text/javascript" src="../../javascript/RealBIMWeb.preload.js"></script>
        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/BlackHole3D.js"></script>
        <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.preload.js"></script> -->

        <!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script> -->
        <script async type="text/javascript" src="../Engine.js"></script>
        <!-- 引擎初始化 -->
        <script type="text/javascript">
            function RESystemEngineCreatedCallBack() {
                // BlackHole3D.Common.setFakeSphMode(true);
                var dataSetList = [
                    // {
                    //     dataSetId: '3a1c1be4e8dfe028df48918ed4cfdbbb',
                    //     resourcesAddress:
                    //         'https://engine3.bjblackhole.com/engineweb/api/autoconvert/EngineRes/RequestEngineRes?dir=url_res04&path=3a1c1be4e8dfe028df48918ed4cfdbbb',

                    //     groundDisplay: true,
                    //     terrSuffix: '',
                    // },
                    {
                        dataSetId: '地形影像',
                        resourcesAddress:
                            'https://demo.bjblackhole.com/default.aspx?dir=url_res02&path=res_skymap',
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
                BlackHole3D.Common.setMaxResMemMB(5500);
                BlackHole3D.Common.setExpectMaxInstMemMB(4500);
                BlackHole3D.Common.setExpectMaxInstDrawFaceNum(20000000);
                BlackHole3D.Common.setPageLoadLev(2);
            }
            function REDataSetLoadFinishCallBack() {}

            function addAnc() {
                let terrShpAnc_1 = new BlackHole3D.RETerrainShpAncInfo();
                terrShpAnc_1.groupName = 'terrShpAnc';
                terrShpAnc_1.ancName = 'terrShpAnc_1';
                terrShpAnc_1.pos = [13564024.192906115, 4769341.498752505, -0.17777701886370778];
                terrShpAnc_1.picPath = 'https://demo.bjblackhole.com/demopage/examplesImgs/anc.png';
                terrShpAnc_1.textInfo = '未拆迁';
                terrShpAnc_1.picWidth = 32;
                terrShpAnc_1.picHeight = 32;
                terrShpAnc_1.texBias = [1, 0];
                terrShpAnc_1.texFocus = [0, 0];

                var terrShpAncList = [terrShpAnc_1];
                BlackHole3D.Terrain.addTerrShpAnc('地形影像', terrShpAncList);
            }

            function addLine() {
                //矢量文字信息
                var shpTextInfo = new BlackHole3D.REShpTextInfo();
                shpTextInfo.text = '测试画线';
                shpTextInfo.texBias = [1, 0];
                shpTextInfo.textClr = new BlackHole3D.REColor(255, 255, 255, 255);
                shpTextInfo.textBorderClr = new BlackHole3D.REColor(0, 0, 0, 128);
                shpTextInfo.textBackMode = 2;
                shpTextInfo.textBackBorder = 2;
                shpTextInfo.textBackClr = new BlackHole3D.REColor(0, 0, 0, 128);

                //地形矢量线信息
                var terrShpLine_1 = new BlackHole3D.RETerrShpLineInfo();
                terrShpLine_1.shpName = 'terrShpLine_1';
                terrShpLine_1.potList = [
                    [13563740.540851377, 4769211.209846852, -0.0784632723480172],
                    [13563349.972252555, 4767325.586231201, -0.07863956120309012],
                    [13565240.192362081, 4768533.236580701, -0.07858742746975622],
                ];
                terrShpLine_1.fillState = 1;
                terrShpLine_1.lineClr = new BlackHole3D.REColor(255, 0, 0, 255);
                terrShpLine_1.fillClr = new BlackHole3D.REColor(255, 255, 255, 128);
                terrShpLine_1.textPos = -2;
                terrShpLine_1.groupName = 'a';
                terrShpLine_1.textInfo = shpTextInfo;

                var terrShpLineList = [terrShpLine_1];
                BlackHole3D.Terrain.addTerrShpLine('地形影像', terrShpLineList);
            }

            function locAnc() {
                BlackHole3D.Terrain.setCamToTerrShpAnc("地形影像", ["terrShpAnc_1"], 20.0);
            }
            function locLine() {
                BlackHole3D.Terrain.setCamToTerrShpLine("地形影像", ["terrShpLine_1"], 200.0);
            }
        </script>
    </body>
</html>
