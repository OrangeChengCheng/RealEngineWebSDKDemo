<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
    <title>demo</title>
    <!-- <link rel="stylesheet" href="https://demo.bjblackhole.com/BlackHole3.0/css/style.css"> -->
    <link rel="stylesheet" href="../DevStyle.css">
</head>
<body>
<div id="canvas-cntrNew">
    <div class="btnNew">
        <select name="" id="select" class="mg-l-10" onchange="set()">
		  	<option value="1,1">右上</option>
            <option value="-1,1">左上</option>
            <option value="-1,-1">左下</option>
            <option value="1,-1">右下</option>
            <option value="0,1">上</option>
            <option value="0,-1">下</option>
            <option value="-1,0">左</option>
            <option value="1,0">右</option>
            <option value="0,0">中</option>
        </select>
        <span class="mg-l-10" style="color: #000; font-size: 14px;">选择下拉viewCube停靠方位，默认右上角</span>
    </div>
    <canvas id="canvas" style="width:100%; height:100%;" oncontextmenu="event.preventDefault()"
            tabindex="1"></canvas>
    <div class="custom-loading-container">
        <div class="loading-box">
            <div class="icon-box">
                <img src="https://demo.bjblackhole.com/BlackHole3.0/imgs/loading.gif" />
            </div>
            <div class="common-global-progress-box">
                <div class="custom-progress-box">
                    <div class="progress-bar">
                        <div class="progress-bar-outer">
                            <div class="progress-bar-inner"></div>
                        </div>
                    </div>
                </div>
                <div class="custom-text"></div>
            </div>
            <div class="process-info-box"></div>
        </div>
    </div>

</div>
<script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.js"></script>
<script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/BlackHole3D.js"></script>
<script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/sdk/RealBIMWeb.preload.js"></script>
<!-- <script async type="text/javascript" src="https://demo.bjblackhole.com/BlackHole3.0/js/Engine.js"></script> -->
<script async type="text/javascript" src="../Engine.js"></script>
<!-- 引擎初始化 -->
<script type='text/javascript'>
    var dataSetId = "3a1302ebf45d985e13bab65cce241ff2"
    var dataSetList = [
                {
                    dataSetId,
                    resourcesAddress: "https://demo.bjblackhole.com/default.aspx?dir=url_res03&path=3a1302ebf45d985e13bab65cce241ff2",
                    useTransInfo: false
                }
            ];
    // 在回调里执行隐藏其他两个UI，以便观察效果
    function REDataSetLoadFinishCallBack() {
        // BlackHole3D.Graphics.setSysUIPanelVisible(false); // 隐藏底部UI栏
        BlackHole3D.Graphics.setGeoCoordVisible(false); // 隐藏左上角”地球“
    }
    function set() {
        let value = document.getElementById("select").value.split(",").map(Number);
        BlackHole3D.Graphics.setViewCubeArea(value)
    }


       
</script>
</body>

</html>
