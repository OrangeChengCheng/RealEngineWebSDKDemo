                <button onclick="local(-1)">定位所有</button>

        <!-- 引擎初始化相关接口 -->
        <script type="text/javascript">
            function addListener() {
                //探测
                document.addEventListener('RESystemSelElement', RESystemSelElement); //鼠标探测模型事件（左键单击和右键单击）
                document.addEventListener('RESystemSelShpElement', RESystemSelShpElement); //鼠标探测矢量元素事件
            }
            function RESystemSelShpElement(e) {
                console.log('-- 鼠标探测矢量元素事件 --', BlackHole3D.Probe.getCurCombProbeRet());
            }
            function RESystemSelElement(e) {
                console.log('-- 鼠标探测模型事件 --', BlackHole3D.Probe.getCurCombProbeRet());
            }
            function loadDataSet() {
                var dataSetList = [
                    {
                        dataSetId: '单体化_Grid',
                        resourcesAddress: 'https://demo.bjblackhole.com/default.aspx?dir=url_res03&path=res_qxsy',
                        useTransInfo: true,
                        transInfo: [
                            [1, 1, 1],
                            [0, 0, 0, 1],
                            [9200, 27000, 0.0],
                        ],
                        dataSetCRS: '',
                        dataSetCRSNorth: 0.0,
                    },
                ];
                BlackHole3D.Model.loadDataSet(dataSetList, true);
            }
            var Monomer_Rgn_count = 0;
            function ShpEditStart() {
                BlackHole3D.Monomer.startEditState();
            }
            function ShpEditEnd() {
                Monomer_Rgn_count++;
                BlackHole3D.Monomer.endEditState();
            }
            function AddMonomerRgn() {
                BlackHole3D.Monomer.startAddMonomerState('Monomer_' + Monomer_Rgn_count);
            }
            function local(e) {
                let monomerIdList = BlackHole3D.Monomer.getAllMonomerId();
                if (monomerIdList.length <= 0) return;
                if (e == -1) {
                    BlackHole3D.Monomer.setCamToData(monomerIdList);
                } else {
                    if (monomerIdList.length <= e) return;
                    BlackHole3D.Monomer.setCamToData([monomerIdList[e]]);
                }
            }
            function Remove() {
                let monomerIdList = BlackHole3D.Monomer.getAllMonomerId();
                BlackHole3D.Monomer.delData(monomerIdList);
            }
            function OpenTrans() {
                BlackHole3D.Edit.startEdit();
                BlackHole3D.Edit.openAffineTransEditWnd();
            }
            function defaultDataSet() {
                BlackHole3D.Monomer.setDefaultClr(new BlackHole3D.REColor(0, 255, 0, 128));
                BlackHole3D.Monomer.setEditApplyDataSetId('单体化_Grid');
            }
            function logAll() {
                console.log(BlackHole3D.Monomer.getData(BlackHole3D.Monomer.getAllMonomerId()));
            }
